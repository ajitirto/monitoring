services:
  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - .:/scripts
    entrypoint: ["k6", "run", "/scripts/api_test.js"]
    networks:
      - monitoring
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
    # Tambahkan ini di bawah servis k6:
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  monitoring:
    external: true
